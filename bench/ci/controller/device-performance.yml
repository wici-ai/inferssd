name: InferSSD operator-authorized device report
run-name: operator-selected-report

# Export only to the protected main of PRIVATE wici-ai/inferssd-device-ci.
# Hosted control reads PR metadata; candidate code runs only in root-stage sandboxes.
on:
  workflow_dispatch:
    inputs:
      prepared_envelope:
        description: Complete sealed operator/source/impact/scope/root-staged job envelope
        required: true
        type: string
permissions: {}
concurrency:
  group: operator-selected-${{ github.actor }}
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'wici-ai/inferssd-device-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: physical-devices
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Admit sealed operator source and physical execution scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFERSSD_CI_ENABLED: ${{ vars.INFERSSD_CI_ENABLED }}
        run: python3 -I control/bench/ci/selected_controller.py operator_preflight --control control --policy control/bench/ci/policy.json --plan admission.json
      - name: Dispatch and collect the same selected plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFERSSD_CI_ENABLED: ${{ vars.INFERSSD_CI_ENABLED }}
        run: python3 -I control/bench/ci/selected_controller.py execute --control control --policy control/bench/ci/policy.json --plan admission.json --artifacts selected-artifacts
      - name: Cancel any remaining exact child runs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I control/bench/ci/selected_controller.py cancel_children --control control --policy control/bench/ci/policy.json --plan admission.json --artifacts selected-artifacts
      - name: Retain every admission, dispatch and child attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selected-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission.json
            selected-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: control
    # No path filter or success-only dependency: rejected/missing jobs get a
    # terminal failure report, never a skipped job mistaken for acceptance.
    if: always() && github.repository == 'wici-ai/inferssd-device-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: selected-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained
      - name: Rebuild scoped acceptance and write an Actions report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFERSSD_CI_ENABLED: ${{ vars.INFERSSD_CI_ENABLED }}
        run: python3 -I control/bench/ci/selected_controller.py operator_report --control control --policy control/bench/ci/policy.json --plan retained/admission.json --artifacts retained/selected-artifacts --output aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selected-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate.json
          if-no-files-found: warn
          retention-days: 30
