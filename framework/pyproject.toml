[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferssd"
version = "0.0.0"  # set at the first release
description = "InferSSD typed settings and owned inference runtime"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.27,<2"]

[project.scripts]
inferssd = "inferssd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inferssd = ["py.typed", "configuration/schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/inferssd"]

[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/fixtures", "tests/compat"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
# Original observer inputs are hash-bound; keep linting and byte checks active.
exclude = ["tests/launch_numeric_cases.py"]
