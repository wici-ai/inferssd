# DeepSeek-V4.1-Flash: Q8_0 dense weights and MXFP4 experts (any GGUF release with the PR #28696 layout, e.g. the
# 1017 one), on this checkout's engine.  Data only: run-ssd-llama.sh and adaptive.sh read KEY=VALUE lines (VALUE
# runs to the end of the line or to a ' #' comment, optionally in single quotes) and never execute the file.
# the name of the server's scope and of its disk prompt cache
NAME=dsv41-mxfp4
# the first shard, searched for in MODEL_DIR and two directory levels below it
MODEL_GLOB=DeepSeek-V4.1-Flash*Q8_0-00001-of-00010.gguf
# the GGUF carries the V4 template; V4.1's, with the thinking of earlier turns kept
TEMPLATE=models/templates/deepseek-ai-DeepSeek-V4.1.jinja
TEMPLATE_KWARGS={"drop_thinking": false}
# the model's sampling (its generation config): the GGUF names none, and these arguments override what one names
SAMPLING=--temp 1.0 --top-p 0.95 --top-k 0 --min-p 0
# model-intrinsic engine switches: the engram rows prefetched once known; the fused hyper-connection mixing
ENGINE_ENV=LLAMA_DSV41_ENGRAM_PREFETCH=1 LLAMA_DSV41_HC_FUSED=1
# adaptive.sh: the CPU placements to bootstrap (placement.py; the first is the reference) and the larger prefill
# ubatches it may choose (each costs GPU memory, probed at start-up)
MODEL_PLACEMENTS=all split
MODEL_UBATCHES=16384 32768
# settings.py: the settings it derives that DeepSeek's deployment keeps until an ABBA on its machine accepts the
# derived value (tools/adaptive design, D1-D4); written as pending, not passed.  Not a learned host-memory margin:
# settings.py writes one only on unified memory, where DeepSeek's deployment does not run
PENDING=GGML_KIMI_CPU_PREFILL_MAX_TOKENS UBATCH CONTEXT CTX_CHECKPOINTS GGML_KIMI_CPU_SINK_PREFETCH
