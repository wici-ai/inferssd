name: Performance report
description: A controlled comparison on real hardware.
labels: ["perf"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Select every backend the runs use. CPU only means no GPU.
      multiple: true
      options:
        - CUDA
        - Metal
        - Vulkan
        - CPU only
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Model storage
      options:
        - One drive
        - Several drives or a RAID volume
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Compared versions and hardware
      description: >-
        The InferSSD versions (`date.build`) and commits, build flags, model revision and checksums,
        hardware and host settings.
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload and measurements
      description: Prompt hash, token count, sampling, cold/warm state, first-token latency, decode windows, repetitions and raw results.
    validations:
      required: true
