name: CUDA

# Compile-only validation without a GPU. It runs whenever the engine or the
# build configuration changes and does not establish GPU runtime correctness.
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/cuda.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "engine/**"
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/cuda.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-compile:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No source branch separates 120a from 121a, so each toolkit runs once.
          # CUDA 13.0's CCCL 3.0 skips the newer CCCL branches in the CUB code.
          - arch: 121a
            image: nvidia/cuda:13.0.2-devel-ubuntu24.04@sha256:5dc1bca23d05bd37b011be68ec470c03b403a5da07ec3a86e41af9470e9d0cc6
          - arch: 120a
            image: nvidia/cuda:13.4.3-devel-ubuntu24.04@sha256:cd530dd9b42a4866c2480b21cad7db0ff7b9c5b48c36455e7284328922963367
    steps:
      - run: apt-get update && apt-get install -y cmake ninja-build git libssl-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the driver stub for link-only validation
        shell: bash
        run: |
          set -eu
          stub=/usr/local/cuda/lib64/stubs/libcuda.so
          test -f "$stub"
          link_dir="$RUNNER_TEMP/cuda-driver-link"
          mkdir -p "$link_dir"
          # The toolkit stub has SONAME libcuda.so.1 but ships as libcuda.so.
          # Resolve that transitive dependency without a GPU driver or runtime RPATH.
          ln -s "$stub" "$link_dir/libcuda.so.1"
          printf 'CUDA_DRIVER_LINK_DIR=%s\n' "$link_dir" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux-cuda -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,$CUDA_DRIVER_LINK_DIR"
      - name: Build
        run: cmake --build build-linux-cuda --parallel 4 --target inferssd-server inferssd-memprobe kimi-vram-tier

  windows-cuda-compile:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CUDA_REDIST: 12.9.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: CUDA toolkit
        # The compiler, runtime, CCCL and cuBLAS archives, each checked against NVIDIA's manifest.
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist/'
          $manifest = Invoke-RestMethod "${base}redistrib_$env:CUDA_REDIST.json"
          $root = Join-Path $env:RUNNER_TEMP 'cuda'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($name in 'cuda_nvcc', 'cuda_cudart', 'cuda_cccl', 'libcublas', 'cuda_nvtx', 'cuda_profiler_api') {
            $part = $manifest.$name.'windows-x86_64'
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $part.relative_path -Leaf)
            # The server can end a large response early: resume until the archive is whole.
            for ($i = 0; $i -lt 20 -and -not ((Test-Path $zip) -and (Get-Item $zip).Length -ge [int64]$part.size); $i++) {
              curl.exe -sSL -C - -o $zip ($base + $part.relative_path)
            }
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $part.sha256) { throw "$name does not match the manifest" }
            tar -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE) { throw "$name does not extract" }
            $extracted = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($zip))
            Copy-Item -Recurse -Force (Join-Path $extracted '*') $root
          }
          "CUDA_PATH=$root" >> $env:GITHUB_ENV
      - name: Configure and build
        # As install.ps1 builds: LLVM clang in the Visual Studio C++ tools environment, whose cl is nvcc's host compiler.
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" > nul || exit /b 1
          set "PATH=%ProgramFiles%\LLVM\bin;%CUDA_PATH%\bin;%PATH%"
          cmake --preset windows-cuda -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=120a "-DCUDAToolkit_ROOT=%CUDA_PATH:\=/%" "-DCMAKE_CUDA_COMPILER=%CUDA_PATH:\=/%/bin/nvcc.exe" || exit /b 1
          cmake --build build-windows-cuda --parallel 4 --target inferssd-server || exit /b 1
