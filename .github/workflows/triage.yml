name: Triage

# Labels new issues and assigns them to their owner; see scripts/triage.py. Pull requests are left to the
# automated reviewer in pr-agent.yml.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Label and assign
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/triage.py
