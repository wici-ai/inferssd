name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream snapshot
        # This snapshot is already in main's history. Create the local alias
        # without depending on a separately maintained remote branch.
        run: git branch upstream 8884f8314ce8ea96d62cd602b6bbf7fc25758a09
      - name: Public content
        env:
          PROPOSED_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/public-scan.py --skip upstream --ref "$PROPOSED_REF"
      - name: Production module boundaries
        run: |
          python3 scripts/inferssd/check-layering.py
          python3 scripts/inferssd/test-layering.py
          python3 scripts/inferssd/check-layout.py
      - name: Shell and Python syntax
        run: |
          shellcheck scripts/upstream-snapshot.sh bench/device/gate.sh
          python3 -m py_compile scripts/public-scan.py scripts/check-pr-title.py
          python3 scripts/test-public-scan.py
          python3 scripts/test-check-pr-title.py
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret scan
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all"

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The recorded transcripts are bound to 3.9 and 3.12, and skip on 3.14.
          # The last version listed, 3.12, is the default.
          python-version: |
            3.9
            3.14
            3.12
      - name: Install test dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 ruff==0.17.1 mypy==1.18.2
          .venv/bin/python -m pip install ./framework
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Framework lint
        run: |
          ruff check --config framework/tests/fixtures/adaptive/ruff.toml framework/tests/compat framework/tests/fixtures/adaptive
          ruff check --isolated --select F bench
          ruff check framework
          ruff format --check framework
          mypy --config-file framework/pyproject.toml framework/src
      - name: Framework tests
        run: python3 -m pytest -q bench/tests framework/tests
      - name: Framework tests on Python 3.9
        run: |
          python3.9 -m venv .venv39
          .venv39/bin/python -m pip install pytest==8.4.2 ./framework
          .venv39/bin/python -m pytest -q bench/tests framework/tests tests/integration/test-macos-launcher.py tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py
      - name: Framework tests on Python 3.14
        run: |
          python3.14 -m venv .venv314
          .venv314/bin/python -m pip install pytest==9.1.1 "./framework[hf]"
          .venv314/bin/python -m pytest -q bench/tests framework/tests
      - name: Mac launcher and alias-index checks
        run: |
          ruff check --isolated --select F framework/tests/fixtures/macos/run-macos-ssd.py framework/tests/fixtures/macos/kimi-build-gguf-expert-alias-tsv.py tests/integration/test-macos-launcher.py bench/macos/measure.py bench/macos/measurement_images.py tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py
          bash -n framework/tests/fixtures/oracle/launch/scripts/run-macos-ssd.sh
          python3 -m pytest -q tests/integration/test-macos-launcher.py tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py
      - name: Launcher tests
        shell: bash
        run: |
          set -o pipefail
          bash framework/tests/fixtures/oracle/launch/tools/adaptive/tests/test_launcher_settings.sh | tee launcher-settings.log
          bash framework/tests/fixtures/oracle/launch/tools/adaptive/tests/test_launcher_replica.sh | tee launcher-replica.log
          if grep -E '\bSKIP\b' launcher-settings.log launcher-replica.log; then exit 1; fi

  cpu-unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset linux-cpu -DGGML_NATIVE=OFF
      - name: Build
        run: cmake --build build-linux-cpu --parallel 4 --target inferssd-server inferssd-cpuprobe inferssd-ssdprobe test-sched-inplace test-sched-offload test-ssd-model-adapter test-ssd-runtime-policy test-dsv41-engram test-kimi-prefill-cost test-moe-pack-copy-plan test-reasoning-budget test-ssd-prepared-graph test-ssd-precompute-memory test-ssd-cuda-reserve test-ssd-context-telemetry test-graph-overhead test-test-resources test-c0-store test-c0-config test-c0-parser-failures test-ssd-settings-telemetry test-ssd-runtime-options test-ssd-cpu-api test-ssd-source-index test-ssd-host-arbiter test-ssd-host-prefault
      - name: Synthetic tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-linux-cpu --output-on-failure --no-tests=error -R '^(sched_inplace|sched_offload|ssd_model_adapter|ssd_runtime_policy|test-dsv41-engram|kimi_prefill_cost|moe_pack_copy_plan|test-reasoning-budget|ssd_prepared_graph|ssd_precompute_memory|ssd_cuda_reserve|ssd_context_telemetry|test-graph-overhead|test_resources|c0-store|c0-config|c0-parser-failures|ssd_settings_telemetry|ssd_runtime_options|ssd_cpu_api|ssd_source_index|ssd_host_arbiter|ssd_host_prefault)$' | tee cpu-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' cpu-tests.log; then exit 1; fi
      - name: CPU probe smoke run
        shell: bash
        run: |
          build-linux-cpu/bin/inferssd-cpuprobe --rows 64 --cols 256 --tokens 1,2 --min-seconds 0 --threads 1 \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "inferssd-cpuprobe/1" and d["dram"] and d["compute"] and not d["skipped"], d'

  macos:
    if: github.event_name == 'workflow_dispatch' || (!github.event.repository.private && (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Host CPU and memory
        run: |
          uname -m
          sysctl hw.logicalcpu hw.physicalcpu hw.memsize
      - name: Build Metal and the SSD executor tests
        run: |
          cmake --preset macos-metal
          cmake --build build-macos-metal --parallel 3 --target llama-cli inferssd-server inferssd-cpuprobe inferssd-ssdprobe test-sched-inplace test-sched-offload test-chat test-backend-ops test-kimi-cpu-sink test-kimi-cpu-prefill test-kimi-cpu-prefill-graph test-ssd-source-index test-ssd-read-ring test-ssd-platform-threads test-ssd-platform-memory test-llama-mmap-dontneed
      - name: SSD executor and Muse rendering tests
        shell: bash
        run: |
          set -o pipefail
          # The sink and grouped prefill against ggml reference graphs, bit for bit, on ggml threadpools of
          # 1 to 3 threads, with the store, read ring and platform layer they run on.
          ctest --test-dir build-macos-metal --output-on-failure --no-tests=error -R '^(sched_inplace|sched_offload|kimi_cpu_sink|kimi_cpu_sink_threadpool|kimi_cpu_sink_threadpool_poll|kimi_cpu_sink_activation_t2_d1_ready1|kimi_cpu_sink_swiglu|kimi_cpu_sink_muse_q8_0|kimi_cpu_sink_muse_bf16|kimi_cpu_sink_registered|kimi_cpu_prefill|kimi_cpu_prefill_graph|kimi_cpu_prefill_registered|ssd_source_index|ssd_read_ring|ssd_platform_threads|ssd_platform_memory|test-llama-mmap-dontneed)$' | tee mac-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' mac-tests.log; then exit 1; fi
          (cd engine && ../build-macos-metal/bin/test-chat --template muse-spark)
          build-macos-metal/bin/inferssd-cpuprobe --rows 64 --cols 256 --tokens 1,2 --min-seconds 0 --threads 1 \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "inferssd-cpuprobe/1" and d["dram"] and d["compute"] and not d["skipped"], d'
      - name: Quantized CPU operator checks on Apple Silicon
        shell: bash
        run: |
          set -o pipefail
          build-macos-metal/bin/test-backend-ops test -b CPU -o MUL_MAT_ID -p 'type_a=(q4_K|q5_K|q8_0)' | tee mac-operators.log
          grep -q '148/148 tests passed' mac-operators.log

