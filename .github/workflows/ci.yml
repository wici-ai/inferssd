name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream snapshot
        # fetch-depth: 0 already fetched all branch history. Credentials are
        # deliberately not persisted, so resolve the local remote-tracking ref.
        run: git branch upstream refs/remotes/origin/upstream
      - name: Public content
        env:
          PROPOSED_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/public-scan.py --skip upstream --ref "$PROPOSED_REF"
      - name: Production module boundaries
        run: python3 scripts/inferssd/check-layering.py
      - name: Shell and Python syntax
        run: |
          shellcheck scripts/check-import.sh scripts/upstream-snapshot.sh bench/device/gate.sh
          python3 -m py_compile scripts/public-scan.py
          python3 scripts/test-public-scan.py
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret scan
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all"

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 ruff==0.17.1 mypy==1.18.2
          .venv/bin/python -m pip install ./tools/inferssd
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Framework lint
        run: |
          ruff check tools/adaptive
          ruff check --isolated --select F bench
          ruff check tools/inferssd
          ruff format --check tools/inferssd
          mypy --config-file tools/inferssd/pyproject.toml tools/inferssd/src
      - name: Framework tests
        run: python3 -m pytest -q tools/adaptive/tests bench/tests tools/inferssd/tests
      - name: Mac launcher and alias-index checks
        run: |
          ruff check --isolated --select F scripts/run-macos-ssd.py scripts/kimi-build-gguf-expert-alias-tsv.py tests/test-macos-launcher.py bench/macos/measure.py bench/macos/measurement_images.py tests/test-macos-measurement.py tests/test-macos-measurement-images.py
          shellcheck scripts/run-macos-ssd.sh
          python3 -m pytest -q tests/test-macos-launcher.py tests/test-macos-measurement.py tests/test-macos-measurement-images.py
      - name: Launcher tests
        shell: bash
        run: |
          set -o pipefail
          bash tools/adaptive/tests/test_launcher_settings.sh | tee launcher-settings.log
          bash tools/adaptive/tests/test_launcher_replica.sh | tee launcher-replica.log
          if grep -E '\bSKIP\b' launcher-settings.log launcher-replica.log; then exit 1; fi

  cpu-unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF
      - name: Build
        run: cmake --build build --parallel 2 --target llama-server test-dsv41-engram test-kimi-prefill-cost test-moe-pack-copy-plan test-reasoning-budget test-ssd-prepared-graph test-ssd-cuda-reserve test-ssd-context-telemetry test-graph-overhead test-linux-test-resources test-mac-expert-pack-cache test-mac-expert-source test-c0-store test-c0-config test-c0-parser-failures test-ssd-settings-telemetry test-ssd-runtime-options test-ssd-cpu-api test-ssd-source-index test-ssd-host-arbiter test-ssd-host-prefault
      - name: Synthetic tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error -R '^(test-dsv41-engram|kimi_prefill_cost|moe_pack_copy_plan|test-reasoning-budget|ssd_prepared_graph|ssd_cuda_reserve|ssd_context_telemetry|test-graph-overhead|linux_test_resources|mac_expert_pack_cache|c0-store|c0-config|c0-parser-failures|ssd_settings_telemetry|ssd_runtime_options|ssd_cpu_api|ssd_source_index|ssd_host_arbiter|ssd_host_prefault)$' | tee cpu-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' cpu-tests.log; then exit 1; fi
          python3 tests/test-mac-expert-source.py build/bin/test-mac-expert-source

  macos:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Metal and portable cache tests
        run: SSD_LLAMA_BUILD_JOBS=3 bash scripts/build-macos-metal.sh
      - name: Cache and Muse rendering tests
        run: |
          ctest --test-dir build-mac --output-on-failure --no-tests=error -R '^(mac_expert_pack_cache|mac_expert_operator_.*|test-llama-mmap-dontneed)$'
          python3 tests/test-mac-expert-source.py build-mac/bin/test-mac-expert-source
          build-mac/bin/test-chat --template muse-spark
      - name: Quantized CPU operator checks on Apple Silicon
        shell: bash
        run: |
          set -o pipefail
          build-mac/bin/test-backend-ops test -b CPU -o MUL_MAT_ID -p 'type_a=(q4_K|q5_K|q8_0)' | tee mac-operators.log
          grep -q '148/148 tests passed' mac-operators.log

  cuda-compile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [120a, 121a]
    steps:
      - run: apt-get update && apt-get install -y cmake ninja-build git liburing-dev libssl-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the driver stub for link-only validation
        shell: bash
        run: |
          set -eu
          stub=/usr/local/cuda/lib64/stubs/libcuda.so
          test -f "$stub"
          link_dir="$RUNNER_TEMP/cuda-driver-link"
          mkdir -p "$link_dir"
          # The toolkit stub has SONAME libcuda.so.1 but ships as libcuda.so.
          # Resolve that transitive dependency without a GPU driver or runtime RPATH.
          ln -s "$stub" "$link_dir/libcuda.so.1"
          printf 'CUDA_DRIVER_LINK_DIR=%s\n' "$link_dir" >> "$GITHUB_ENV"
      - name: Configure CUDA
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} -DGGML_CUDA_MOE_STREAM_BATCH=ON -DGGML_CUDA_KIMI_VRAM_TIER=ON -DCMAKE_CXX_FLAGS=-ffp-contract=off "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,$CUDA_DRIVER_LINK_DIR" -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_WEBUI=OFF
      - run: cmake --build build --parallel 2 --target llama-server kimi-vram-tier kimi-mxfp4-parity
