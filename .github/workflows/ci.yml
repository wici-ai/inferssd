name: CI

# Pull requests, every merge to main, and by hand on any branch. A pull request need not be up to
# date with main to merge; the run on main checks each merge's commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every run on main completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream snapshot
        # This snapshot is already in main's history. Create the local alias
        # without depending on a separately maintained remote branch.
        run: git branch upstream 8884f8314ce8ea96d62cd602b6bbf7fc25758a09
      - name: Public content
        env:
          PROPOSED_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/public-scan.py --skip upstream --ref "$PROPOSED_REF"
      - name: Production module boundaries
        run: |
          python3 scripts/inferssd/check-layering.py
          python3 scripts/inferssd/test-layering.py
          python3 scripts/inferssd/check-layout.py
      - name: Shell and Python syntax
        run: |
          shellcheck scripts/upstream-snapshot.sh bench/device/gate.sh
          python3 -m py_compile scripts/public-scan.py scripts/check-pr-title.py scripts/triage.py
          python3 scripts/test-public-scan.py
          python3 scripts/test-check-pr-title.py
          python3 scripts/test-triage.py
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret scan
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="--all"

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The recorded transcripts are bound to 3.9 and 3.12, and skip on 3.14.
          # The last version listed, 3.12, is the default.
          python-version: |
            3.9
            3.14
            3.12
      - name: Install test dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 ruff==0.17.1 mypy==1.18.2
          .venv/bin/python -m pip install ./framework
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Framework lint
        run: |
          ruff check --config framework/tests/fixtures/adaptive/ruff.toml framework/tests/compat framework/tests/fixtures/adaptive
          ruff check --isolated --select F bench
          ruff check framework
          ruff format --check framework
          mypy --config-file framework/pyproject.toml framework/src
      - name: Framework tests
        run: python3 -m pytest -q bench/tests framework/tests
      - name: Framework tests on Python 3.9
        run: |
          python3.9 -m venv .venv39
          .venv39/bin/python -m pip install pytest==8.4.2 ./framework
          .venv39/bin/python -m pytest -q bench/tests framework/tests tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py
      - name: Framework tests on Python 3.14
        run: |
          python3.14 -m venv .venv314
          .venv314/bin/python -m pip install pytest==9.1.1 "./framework[hf]"
          .venv314/bin/python -m pytest -q bench/tests framework/tests
      - name: Mac measurement checks
        run: |
          ruff check --isolated --select F bench/macos/measure.py bench/macos/measurement_images.py tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py
          python3 -m pytest -q tests/integration/test-macos-measurement.py tests/integration/test-macos-measurement-images.py

  cpu-unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset linux-cpu -DGGML_NATIVE=OFF
      - name: Build
        run: cmake --build build-linux-cpu --parallel 4 --target inferssd-server inferssd-cpuprobe inferssd-ssdprobe inferssd-ci-tests
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # The tests labelled ci (docs/testing.md). The RAM cache cases need a finite cgroup v2 memory limit,
          # which a systemd scope gives them.
          sudo systemd-run --scope --quiet -p MemoryMax=8G -p MemorySwapMax=0 -- sudo -u "$USER" env "PATH=$PATH" \
            ctest --test-dir build-linux-cpu --output-on-failure --no-tests=error -L ci | tee cpu-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' cpu-tests.log; then exit 1; fi
      - name: CPU probe smoke run
        shell: bash
        run: |
          build-linux-cpu/bin/inferssd-cpuprobe --rows 64 --cols 256 --tokens 1,2 --min-seconds 0 --threads 1 \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "inferssd-cpuprobe/2" and d["dram"] and d["compute"] and not d["skipped"], d'

  macos:
    if: github.event_name == 'workflow_dispatch' || (!github.event.repository.private && (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Host CPU and memory
        run: |
          uname -m
          sysctl hw.logicalcpu hw.physicalcpu hw.memsize
      - name: Build Metal and the SSD executor tests
        run: |
          cmake --preset macos-metal
          cmake --build build-macos-metal --parallel 3 --target llama-cli inferssd-server inferssd-cpuprobe inferssd-ssdprobe test-chat test-backend-ops inferssd-ci-tests
      - name: SSD executor and Muse rendering tests
        shell: bash
        run: |
          set -o pipefail
          # The tests labelled ci (docs/testing.md).
          ctest --test-dir build-macos-metal --output-on-failure --no-tests=error -L ci | tee mac-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' mac-tests.log; then exit 1; fi
          (cd engine && ../build-macos-metal/bin/test-chat --template muse-spark)
          build-macos-metal/bin/inferssd-cpuprobe --rows 64 --cols 256 --tokens 1,2 --min-seconds 0 --threads 1 \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "inferssd-cpuprobe/2" and d["dram"] and d["compute"] and not d["skipped"], d'
      - name: Quantized CPU operator checks on Apple Silicon
        shell: bash
        run: |
          set -o pipefail
          build-macos-metal/bin/test-backend-ops test -b CPU -o MUL_MAT_ID -p 'type_a=(q4_K|q5_K|q8_0)' | tee mac-operators.log
          grep -q '148/148 tests passed' mac-operators.log

  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Framework tests
        run: |
          python -m pip install pytest==9.1.1 ./framework
          python -m pytest -q framework/tests
      - name: Build the engine and the SSD executor tests
        # As the packages build it: LLVM clang with the Visual Studio C++ tools' 14.44 toolset. The
        # runner's newest toolset can be one whose standard library requires a newer clang than the
        # runner has (STL1000), so it is not taken by default.
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 > nul || exit /b 1
          set "PATH=%ProgramFiles%\LLVM\bin;%PATH%"
          cmake --preset windows-llvm -DGGML_NATIVE=OFF || exit /b 1
          cmake --build build-windows-llvm --parallel 4 --target inferssd-server inferssd-cpuprobe inferssd-ssdprobe inferssd-ci-tests || exit /b 1
      - name: SSD executor tests
        shell: bash
        run: |
          set -o pipefail
          # The tests labelled ci (docs/testing.md).
          ctest --test-dir build-windows-llvm --output-on-failure --no-tests=error -L ci | tee windows-tests.log
          if grep -E '\bSKIP\b|\*\*\*Not Run|\*\*\*Skipped' windows-tests.log; then exit 1; fi
          build-windows-llvm/bin/inferssd-cpuprobe --rows 64 --cols 256 --tokens 1,2 --min-seconds 0 --threads 1 \
            | python -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "inferssd-cpuprobe/2" and d["dram"] and d["compute"] and not d["skipped"], d'
