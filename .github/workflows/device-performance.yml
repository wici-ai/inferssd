name: InferSSD device admission information

# Device performance checks run on maintainer-operated hardware outside this
# workflow. This preview has no device runner, App token, secret or dispatch permission.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions: {}
jobs:
  device-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preview complete changed-path selection on hosted hardware
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I bench/ci/preview_selection.py --output selection-preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: device-selection-preview
          path: selection-preview.json
          if-no-files-found: warn
      - name: Device checks require maintainer review
        run: |
          echo "This job previews which device checks a change selects; it does not run them."
          echo "After review, a maintainer triggers them with a Comment review whose complete body is /ci test on the current PR head."
          echo "The selected device checks and the 512-token prompt, 256-token decode comparison then run on maintainer-operated hardware."
          echo "Device checks run only for pull requests from branches in this repository; fork pull requests receive hosted CI only."
