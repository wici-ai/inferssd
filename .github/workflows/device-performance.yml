name: InferSSD device admission information

# Physical execution belongs to the separate private controller.
# This preview has no device runner, App token, secret or dispatch permission.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions: {}
jobs:
  device-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preview complete changed-path selection on hosted hardware
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I bench/ci/preview_selection.py --output selection-preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: device-selection-preview
          path: selection-preview.json
          if-no-files-found: warn
      - name: Physical tests require separate private admission
        run: |
          echo "This is an unprivileged preview, not physical acceptance."
          echo "A source maintainer submits a Comment review whose complete body is /ci test on the current PR head."
          echo "The trusted operator seals base/candidate sources and runs the impact-selected Linux checks and 512/decode256 comparison."
          echo "Results are in the private controller Actions Summary and artifacts; Mac coverage may remain deferred."
