name: Release

# Releases main's head as its version, <yymmdd>.<build> (261119.300): the checked macOS and Windows
# (Vulkan and CUDA) packages of one commit, signed. Each reaches the CDN and the installers' package
# list, which the desktop app follows, as soon as it is checked, not when the slowest is; then one
# GitHub release holds them all and tags the commit with the version. Every published package is a
# release's. See docs/macos-package.md and docs/windows-package.md.
on:
  workflow_dispatch:
    inputs:
      github_release:
        description: >-
          Publish the GitHub release, which tags the commit. Off, the same signed packages reach
          only the CDN and its package lists, which the installers on main and the desktop app read.
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::A release is made from main.'
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          # The commit's day (UTC) and main's commit count, as scripts/engine-resources.py names
          # every build; the release's tag is the version.
          tag="$(TZ=UTC git show -s --format=%cd --date=format-local:%y%m%d HEAD).$(git rev-list --count HEAD)"
          # The release before it: the nearest tag in main's history, of either form.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --match '[0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*' HEAD)
          if [ "$(git rev-parse "$previous^{commit}")" = "$revision" ]; then
            echo "::error::main has not changed since $previous."
            exit 1
          fi
          # Before any package is published: a version that is already a tag is not released again.
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already a tag; its release and packages will not be replaced."
            exit 1
          fi
          echo "Releasing $revision as $tag, after $previous."
          { echo "revision=$revision"; echo "tag=$tag"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"

  macos:
    needs: validate
    uses: ./.github/workflows/package-macos.yml
    with:
      source_ref: ${{ needs.validate.outputs.revision }}
      release_tag: ${{ needs.validate.outputs.tag }}

  # The Windows packages in calls of their own, so the Vulkan package is signed, checked and
  # published while the CUDA one, which takes longest, still builds.
  windows-vulkan:
    needs: validate
    uses: ./.github/workflows/package-windows.yml
    with:
      source_ref: ${{ needs.validate.outputs.revision }}
      release_tag: ${{ needs.validate.outputs.tag }}
      backends: '["vulkan"]'
    secrets:
      # The signed-file store, so a later release signs only what changed.
      APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
      # The windows-signing environment's eSigner credential. A reusable workflow's job reads an
      # environment secret only when its caller passes it by name, even though only the called job
      # names the environment.
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

  windows-cuda:
    needs: validate
    uses: ./.github/workflows/package-windows.yml
    with:
      source_ref: ${{ needs.validate.outputs.revision }}
      release_tag: ${{ needs.validate.outputs.tag }}
      backends: '["cuda"]'
    secrets:
      # The signed-file store, so a later release signs only what changed.
      APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
      # The windows-signing environment's eSigner credential. A reusable workflow's job reads an
      # environment secret only when its caller passes it by name, even though only the called job
      # names the environment.
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

  # Each package reaches the CDN and points its package list at it once its own checks pass.
  publish-macos:
    needs: [validate, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-macos
          path: dist/macos
      - name: Publish the macOS package and its package list
        env:
          APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
        run: |
          test -n "$APP_VERSIONING_TOKEN" || { echo 'APP_VERSIONING_TOKEN is required for the package lists.' >&2; exit 1; }
          python3 scripts/publish-package.py dist/macos

  publish-windows-vulkan:
    needs: [validate, windows-vulkan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-vulkan
          path: dist/windows-vulkan
      - name: Publish the Windows Vulkan package and its package list
        env:
          APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
        run: |
          test -n "$APP_VERSIONING_TOKEN" || { echo 'APP_VERSIONING_TOKEN is required for the package lists.' >&2; exit 1; }
          python3 scripts/publish-package.py dist/windows-vulkan

  publish-windows-cuda:
    needs: [validate, windows-cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-cuda
          path: dist/windows-cuda
      - name: Publish the Windows CUDA package and its package list
        env:
          APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
        run: |
          test -n "$APP_VERSIONING_TOKEN" || { echo 'APP_VERSIONING_TOKEN is required for the package lists.' >&2; exit 1; }
          python3 scripts/publish-package.py dist/windows-cuda

  # The GitHub release, once every package is published: it holds them all, with the notes and the
  # tag-pinned installers, and tags the commit. Without it the packages are published all the same.
  release:
    if: inputs.github_release
    needs: [validate, macos, windows-vulkan, windows-cuda, publish-macos, publish-windows-vulkan, publish-windows-cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      PREVIOUS: ${{ needs.validate.outputs.previous }}
      RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-macos
          path: dist/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-vulkan
          path: dist/windows-vulkan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-cuda
          path: dist/windows-cuda
      # The Windows Vulkan call signed the pinned install.ps1 with its package.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-windows-signed
          path: dist/install-windows
      - name: Prepare both platforms and tag-pinned installers
        run: |
          python3 scripts/prepare-release-assets.py --macos-arm64 dist/macos --windows-x64-vulkan dist/windows-vulkan \
            --windows-x64-cuda dist/windows-cuda \
            --output release-assets --tag "$TAG" --revision "$RELEASE_REVISION" \
            --repository "$GITHUB_REPOSITORY" --signed-install-ps1 dist/install-windows/install.ps1
          sh -n release-assets/install.sh
      - name: Write the release notes
        # The changes are the pull requests merged since the last release, by their titles. A
        # release with highlights of its own has a section in CHANGELOG.md, which comes first.
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_REVISION" -f previous_tag_name="$PREVIOUS" --jq .body > changes.md
          python3 scripts/prepare-release-assets.py --release-notes release-notes.md --changes changes.md \
            --tag "$TAG" --repository "$GITHUB_REPOSITORY"
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; its release and assets will not be replaced." >&2
            exit 1
          fi
          created=no
          cleanup() {
            if [ "$created" = yes ] && [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release delete "$TAG" --yes
            fi
          }
          trap cleanup EXIT
          # A draft creates no tag; publishing it tags the commit.
          gh release create "$TAG" --draft --target "$RELEASE_REVISION" --title "$TAG" --notes-file release-notes.md
          created=yes
          gh release upload "$TAG" release-assets/*
          gh release edit "$TAG" --draft=false --latest
          created=no
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$RELEASE_REVISION"
          echo "Released $TAG ($RELEASE_REVISION)."
