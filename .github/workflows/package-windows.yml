name: Package Windows

# Build the prebuilt Windows packages, one per GPU backend, and check them. Only Release builds them,
# for each release, which signs them here and publishes them (release.yml), and a run by hand, on any
# branch, which builds and checks. See docs/windows-package.md.
on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to build and check for the release
        required: true
        type: string
      release_tag:
        description: The release's tag, its version <yymmdd>.<build>, which the packages are checked against
        required: true
        type: string
      backends:
        description: >-
          The GPU backends to package, as a JSON list (both when unset). Release packages each in a
          call of its own, so each is signed, checked and published without waiting for the other.
        required: false
        type: string
        default: '["vulkan", "cuda"]'
    secrets:
      # The signed-file store (scripts/sign-windows.ps1).
      APP_VERSIONING_TOKEN:
        required: true
      # The eSigner credential. These are the windows-signing environment's secrets, which the sign
      # job reads only when the caller passes them by name: one not passed is an empty string.
      ES_USERNAME:
        required: true
      ES_PASSWORD:
        required: true
      ES_CREDENTIAL_ID:
        required: true
      ES_TOTP_SECRET:
        required: true
  # By hand, on any branch: build and check. Only Release signs and publishes. Pull requests and
  # merges do not build packages.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch's runs queue in its group, and a release's run in its own, one per backend, so a release's
  # two calls do not queue behind each other.
  group: package-windows-${{ inputs.release_tag || github.ref }}-${{ join(fromJSON(inputs.backends || '["vulkan", "cuda"]'), '-') }}
  cancel-in-progress: false

jobs:
  # One package for each GPU backend the launch's table names on Windows: CUDA for NVIDIA GPUs,
  # Vulkan for the others and the CPU. The installer picks by the machine's GPU.
  build:
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backends || '["vulkan", "cuda"]') }}
    # The CUDA package, the longest build by far, builds on the organization's larger runner.
    runs-on: ${{ matrix.backend == 'cuda' && 'release-packaging-runner-windows' || 'windows-2025' }}
    timeout-minutes: 240
    env:
      CUDA_REDIST: 12.9.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the build-time Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'vulkan-sdk'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest -UserAgent 'inferssd-build' -Uri 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141') { throw 'Vulkan SDK checksum mismatch' }
          $stdout = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-install.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-install.stderr.txt'
          # LunarG's supported unattended syntax puts global options before the command.
          # copy_only avoids machine registry/PATH changes; only this job needs the SDK.
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdk`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1') -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Write-Host "Vulkan SDK installer exit: $($install.ExitCode); requested root: $sdk"
          Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $sdk) { Get-ChildItem -LiteralPath $sdk | Select-Object Name }
          if ($install.ExitCode -ne 0 -or !(Test-Path -LiteralPath "$sdk\Bin\glslc.exe")) { throw 'Vulkan SDK installation failed; see captured installer output' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
      - name: Preserve SDK install diagnostics
        if: always() && matrix.backend == 'vulkan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulkan-sdk-install-log
          path: ${{ runner.temp }}/vulkan-sdk-install.*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Install the build-time CUDA toolkit
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: scripts/install-cuda-redist.ps1 -Version $env:CUDA_REDIST -Root (Join-Path $env:RUNNER_TEMP 'cuda')
      # As many CUDA compiles at once as the machine's cores and memory allow: one takes up to about
      # 3 GiB. The Vulkan build keeps its two.
      - name: Size the build to the machine
        shell: pwsh
        run: |
          $cores = [Environment]::ProcessorCount
          $gib = [math]::Floor((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          $jobs = if ('${{ matrix.backend }}' -eq 'cuda') { [math]::Max(1, [math]::Min($cores, [math]::Floor($gib / 3))) } else { 2 }
          "BUILD_JOBS=$jobs" >> $env:GITHUB_ENV
          Write-Host "$cores logical processors, $gib GiB of memory: $jobs build jobs"
      - name: Build the relocatable engine package
        shell: cmd
        env:
          INFERSSD_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 > nul || exit /b 1
          if defined VULKAN_SDK set "PATH=%VULKAN_SDK%\Bin;%PATH%"
          if defined CUDA_PATH set "PATH=%CUDA_PATH%\bin;%PATH%"
          set "PATH=%ProgramFiles%\LLVM\bin;%PATH%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -Backend ${{ matrix.backend }} -OutputDirectory dist -Jobs %BUILD_JOBS%
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows-x64-${{ matrix.backend }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # A release signs what it publishes: every code file in the packages carries WiCi AI's signature
  # or its vendor's (docs/windows-package.md). A run by hand signs nothing. The signed packages replace the built ones, so the check runs on the published bytes.
  # Each package is signed on its own; a file the other package shares, signed first, is taken from
  # the signed-file store (scripts/sign-windows.ps1).
  sign:
    needs: build
    if: inputs.release_tag
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backends || '["vulkan", "cuda"]') }}
    # One signing at a time, across a release's calls: two must not use the eSigner one-time password at once.
    concurrency:
      group: windows-signing
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 60
    environment: windows-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-${{ matrix.backend }}
          path: dist/windows-x64-${{ matrix.backend }}
      # A release also publishes an install.ps1 pinned to its tag, signed with the Vulkan package,
      # which every release builds: one artifact of that name per run.
      - name: Pin the release's Windows installer
        if: matrix.backend == 'vulkan'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/prepare-release-assets.py --pinned-install-ps1 dist/installer/install.ps1 --tag $env:RELEASE_TAG --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'The pinned installer could not be written.' }
      - name: Sign every code file the packages carry
        shell: powershell
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          APP_VERSIONING_TOKEN: ${{ secrets.APP_VERSIONING_TOKEN }}
        run: |
          $installer = @(Get-ChildItem -LiteralPath dist/installer -Filter install.ps1 -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          scripts/package-windows-sign.ps1 -Directory dist/windows-x64-${{ matrix.backend }} -File $installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows-x64-${{ matrix.backend }}
          path: dist/windows-x64-${{ matrix.backend }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.backend == 'vulkan'
        with:
          name: install-windows-signed
          path: dist/installer/install.ps1
          if-no-files-found: error
          retention-days: 30

  check:
    needs: [build, sign]
    # After the signing when the run signs, else on the built packages.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backends || '["vulkan", "cuda"]') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-windows-x64-${{ matrix.backend }}
          path: dist
      - name: Relocate, install and run without developer tools
        # GitHub's runner has no GPU, so the CUDA package's check also shows it starts without NVIDIA's driver.
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'inferssd-*-windows-x64-${{ matrix.backend }}.zip')
          if ($zip.Count -ne 1) { throw 'Expected one Windows engine archive' }
          & scripts/check-package-windows.ps1 -Archive $zip[0].FullName

