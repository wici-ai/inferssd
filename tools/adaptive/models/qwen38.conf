# Qwen3.8-Flash-Next: a Q8_0 GGUF and its expert pack, on the Qwen port's engine (architecture qwen4exp, branch
# deepseek2/qwen38: another checkout with its own build).  Sourced by adaptive.sh with ROOT set.
Q=${QWEN_SRC:?set QWEN_SRC to the checkout of the Qwen port, built in build-cuda130}
MODEL=${QWEN_MODEL:-$ROOT/models/Qwen3.8-Flash-Next-Q8_0/Q8_0/Qwen3.8-Flash-Next-Q8_0-00001-of-00006.gguf}
EXPERT_PACK=${QWEN_PACK:-$ROOT/models/qwen38-q8-experts.pack}
LAUNCH=$FW/models/launch-qwen38.sh
SERVER_BIN=$Q/build-cuda130/bin/llama-server
DROP_FILES=""
SERVER_ARGS=""
KNOBS_VIA=extra_env
export PACK=$EXPERT_PACK
# the port's engine has no per-phase pools (no decode participants), so no 'split'
MODEL_PLACEMENTS="all pin"
# nor a disk prompt cache: a server started on a switch prefills the whole history again
SWITCH_KEEPS_HISTORY=0
# its launcher fixes the ubatch (4096)
MODEL_UBATCHES=""
# and takes none of the settings settings.py derives for run-ssd-llama.sh
PENDING="GGML_KIMI_CPU_PREFILL_MAX_TOKENS UBATCH CONTEXT CTX_CHECKPOINTS GGML_KIMI_CPU_SINK_VRAM_HOST_HEADROOM_MIB GGML_KIMI_CPU_SINK_PREFETCH"
