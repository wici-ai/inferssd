[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssdash"
version = "0.1.0"
description = "SSDash offline framework contracts"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ssdash = "ssdash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssdash = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/ssdash"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/fixtures/oracle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
# Original observer inputs are hash-bound; keep linting and byte checks active.
exclude = ["tests/launch_numeric_cases.py"]
