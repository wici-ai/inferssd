# Muse Spark Open 816B-A42B, unsloth UD-Q4_K_XL (Q4_K/Q5_K experts read from the GGUF itself), on this checkout's
# engine.  Data only, read like dsv41.conf.
NAME=muse-spark
# the first shard of the UD-Q4_K_XL quantization, searched for in MODEL_DIR and two directory levels below it
MODEL_GLOB=Muse-Spark-Open-*-UD-Q4_K_XL-00001-of-*.gguf
# the GGUF's own chat template (no TEMPLATE); reasoning off for a benchmark turn is the client's raw suffix
# " to=user<|message|>" after the generation prompt
# no SAMPLING: the GGUF carries the model's (general.sampling.*: temp 1.0, top-p 1.0, top-k 64)
MODEL_PLACEMENTS=all
